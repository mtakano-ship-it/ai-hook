emini Decisions API と Gemini Decision 1 モデルを公開した。文章・画像・音声・動画・PDFを1つ入力し、はい/いいえ・選択・段階評価の質問を最大1,000問まとめて判定し、各回答に確信度（0〜1）を付ける。応答は150〜250ミリ秒、料金は入力100万トークンあたり0.10ドルで出力は無料。", "tags": ["判定", "点検", "PDF", "写真", "確信度", "料金"], "talk": {"person": "Google が11月11日に、書類や写真について最大1,000の質問をまとめて判定し、確信度を付けて返す Gemini Decisions API を公開しました。御社の点呼記録・日報の点検では、記入漏れや不備の有無を項目ごとに判定し、怪しいものだけを運行管理者の確認に回せる可能性があります。できること・やりたいことを伺ったうえで、実際にできるかを無償で検証します。そのためのヒアリングに、オンラインで30分いただけませんか。", "reception": "Google が11月11日に公表した Gemini Decisions API で、御社の点呼記録や日報の点検に関わることができるようになる可能性があります。この情報を担当の方にお届けしたく、ご連絡しました。運行管理のご担当の方に『運行管理の帳票点検に関わるAIの新機能のご案内』とお伝えいただけますか。必要ないとのことでしたら、お電話はここで失礼します。", "subject": "運行管理の帳票点検に関わるAIの新機能のご案内"}, "title": "Google、書類や写真を一度に最大1,000問で判定する Gemini Decisions API を公開", "url": "https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api/", "vendor": "Google"}, {"key": "d3c62fa014c7fbb5", "title": "米Fleetworthy、運送会社の通行料・安全・法令データに普通の言葉で質問できる「Radar」", "vendor": "新興ツール", "trust": "メディア", "kind": "新機能", "published": "2026-11-12", "source_name": "FreightWaves（運送）", "url": "https://www.freightwaves.com/news/ai-in-logistics-how-radar-is-revolutionizing-fleet-data-analysis", "summary": "FreightWaves によると、米国で通行料管理・計量所の通過・安全法令の対応をまとめて提供する Fleetworthy が、初のAI製品 Radar を公開。運送会社が通行料・安全・法令のデータに普通の言葉で質問でき、違反や車載器の載せ替えで生じる通行料の取りこぼしを探せる。まず通行料から始め、法令対応と計量所のデータにも広げる。AIの法令対応企業 Hall も買収した。", "can_do": "通行料の明細や安全・法令のデータに普通の言葉で質問し、料金の取りこぼしがどこで起きているかを探す使い方です。", "before": "通行料の取りこぼし（違反・車載器の別車両への載せ替え）は、専用の道具なしでは追いにくく、データを手作業で抽出していた。", "after": "通行料のデータに質問するだけで取りこぼしの場所を探せる。法令対応・計量所のデータにも広げる予定。", "availability": "米国の運送会社向け。料金・提供開始日・日本での提供は記事に記載なし。", "importance": 2, "tags": ["海外事例", "物流", "通行料", "法令対応", "データ照会"], "industries": [{"key": "butsuryu", "work": "請求書の作成と付帯料金の計上", "change": "高速料金や付帯作業の明細と運行記録を突き合わせ、請求漏れや二重計上をAIが洗い出せる可能性があります。", "ask": "高速料金や待機料など付帯料金の請求漏れは、どのように確かめていますか。", "name": "物流（元請運送・倉庫）"}], "talk": {"subject": "付帯料金の請求漏れに関わるAI情報のご案内", "reception": "FreightWaves という米国の物流専門誌が11月12日 人が承認する範囲の決め方のご案内"}, "title": "AWS Quick、AIの操作を別のAIが事前に判定し危ない操作だけ人に確認させる「Smart Approvals」", "trust": "メディア", "url": "https://www.techno-edge.net/article/2026/11/13/5717.html", "vendor": "その他"}, {"key": "1055bd71c85c5f0f", "title": "Paessler、AI利用料の膨張に上限と横断チームで歯止め　技術者1人が月半ばで4,000ドル", "vendor": "その他", "trust": "メディア", "kind": "調査・指針", "published": "2026-11-13", "source_name": "CIO.com AI", "url": "https://www.cio.com/article/4248060/saying-no-to-ai-spend-is-how-we-protect-ai-value.html", "summary": "CIO.com への寄稿で、ネットワーク監視ソフトの Paessler は、技術者1人が月半ばで Claude の利用料4,000ドルを使った例を挙げ、AIの費用管理を報告。導入時に部署ごとの上限を決め、上限到達を相談のきっかけにする。IT・情報セキュリティ・人事・財務・法務などの横断チームが毎週集まり、新しい道具は既存の道具で足りないかを先に確かめる。McKinsey の調査では93%の企業がAI予算を超えているという。", "can_do": "AIの利用料を、部署ごとの上限と毎週の横断チームの判断で管理し、成果の出る使い方に予算を回す運用の実例です。", "before": "試しに広く使わせた結果、想定を超える請求が続き、1人が月半ばで4,000ドルを使った。", "after": "導入時に上限を決め、上限到達で上長が増額か停止を判断。費用が急に増えた道具は主力の道具に統合した。", "availability": "製品の発表ではなく、1社の社内運用の報告。料金・日本での提供は記事に記載なし。", "importance": 2, "tags": ["海外事例", "費用管理", "利用料", "ガバナンス", "シャドーAI"], "industries": [{"key": "subcon", "work": "図面からの数量拾いと内訳明細書の作成", "change": "AIで見積書づくりを自動化する際、1件あたりの利用料を先に見積もり、月の上限を決めて運用する形が取れる可能性があります。", "ask": "AIの利用料は、部署ごとの予算や上限を決めていますか。", "name": "設備サブコン（空調・衛生・電気）"}, {"key": "jusetsu-shosha", "work": "FAX・メール注文書の基幹システムへの入力", "change": "注文1件あたりのAIの費用と削減時間を並べて、続けるか止めるかを判断できる形で導入できる可能性があります。", "ask": "AIの道具を入れるとき、費用対効果はどなたが判断していますか。", "name": "住宅資材・外構・管材の商社"}], "talk": {"subject": "AIの利用料の管理に関する海外事例のご案内", "reception": "CIO.com が11月13日に報じた海外の事例で、御社でAIを業務に使う際の費用の管理に関わる内容です。この情報を担当の方にお届けしたく、ご連絡しました。見積・積算部門のご担当の方に『AIの利用料の管理に関する海外事例のご案内』とお伝えいただけますか。必要ないとのことでしたら、お電話はここで失礼します。", "person": "海外ではソフトウェア会社の Paessler が、技術者1人が月半ばでAIの利用料4,000ドルを使ったことをきっかけに、部署ごとの上限と横断チームで費用を管理しているという事例が、CIO.com から11月13日に出ています。御社の見積書づくりでAIを使う場合も、1件あたりの費用と削減時間を先に見積もって進められる可能性があります。できること・やりたいことを伺ったうえで、実際にできるかを無償で検証します。そのためのヒアリングに、オンラインで30分いただけませんか。"}, "caution": "1社の寄稿で、上限額の具体的な水準は書かれていない。4,000ドルは開発者の使い方での例で、事務作業の費用ではない。93%は McKinsey の調査の引用。", "id": "n20 *{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 誌名とナビ */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}

.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:38px;height:38px;flex:none}

.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a:hover:not([aria-current="page"]){background:var(--accent-soft);color:var(--ink)}
main{padding-block:22px 64px;display:flex;flex-direction:column;gap:22px}

/* 共通部品 */
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
.h-sec{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.h-sec::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none}
.sub{color:var(--muted);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--hot)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;width:100%;min-width:0}
textarea.field{resize:vertical;line-height:1.6}
label.lb{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.vend{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:12.5px;color:var(--vc)}
.vend i{width:20px;height:20px;border-radius:6px;background:var(--vc);color:#fff;font-style:normal;font-family:var(--f-num);font-size:12px;display:grid;place-items:center;flex:none}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.kind svg{width:14px;height:14px;flex:none}
.trust{display:inline-flex;align-items:center;border-radius:6px;padding:0 7px;font-size:11px;font-weight:900;border:1.5px solid var(--ok);color:var(--ok);white-space:nowrap}
.trust.media{border-color:var(--muted);color:var(--muted)}
.trust.comm{border-color:var(--memo-line);background:var(--memo);color:var(--memo-ink)}
.imp{display:inline-flex;gap:2px}
.imp span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.imp span.on{background:var(--hot)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13.5px}

/* 新着 */
.mast{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
.mast-l{background:var(--ink);color:var(--bg);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.mast-l h1{font-size:clamp(22px,3.4vw,32px);font-weight:900;letter-spacing:.01em}
.mast-l h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62%);padding:0 2px}
.mast-l p{margin:0;font-size:13.5px;opacity:.85;max-width:38em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat .num{font-size:28px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.lead{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;width:100%}

.lead-b{background:var(--memo);color:var(--memo-ink);padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--vc);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;width:100%}

dialog{border:none;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(880px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}

.d-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface)}

.ba{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.ba .arrow{font-family:var(--f-num);font-size:22px;color:var(--accent);font-weight:700}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.indrow dt{color:var(--muted);font-weight:700;font-size:12px;padding-top:9px}
.src a{color:var(--accent);word-break:break-all}

.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.indlist{display:flex;flex-direction:column;gap:8px}

.indbtn b{font-size:14px}
.indbtn span{font-size:12px;color:var(--muted)}

.indhead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.works div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700}
.hook{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}

.stack{display:flex;flex-direction:column;gap:10px;min-width:0}

.chat{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 6px;font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.35}

.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:420px}
.msgs{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.msg{max-width:100%;min-width:0;display:flex;flex-direction:column;gap:6px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:85%;white-space:pre-wrap}

.md h4:first-child{margin-top:0}

.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}

.flow div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);font-size:12.5px}
.flow b{display:block;font-size:13.5px}
.flow em{font-style:normal;display:inline-block;font-size:11px;font-weight:900;border-radius:5px;padding:0 6px;background:var(--accent);color:var(--accent-ink);margin-bottom:3px}

  .brand small{display:none}
}
